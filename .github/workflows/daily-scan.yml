name: Daily Scan

on:
  schedule:
    # 22:15 UTC = after US market close (both DST cases), Thai session long
    # final, crypto uses yesterday's closed candle. :15 offset avoids GitHub's
    # on-the-hour cron congestion. Note: GitHub cron is best-effort; runs may
    # start 5-30 minutes late, which is fine for daily candles.
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: write # commit last_signals.json back to the repo

env:
  CARGO_TERM_COLOR: always

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Scan watchlist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # Retry once after 5 minutes to absorb transient failures
        # (Yahoo Finance occasionally rate-limits datacenter IPs).
        # --heartbeat sends a still-alive summary on days with no signals.
        run: |
          ./target/release/cdc-az-daily-alert scan --heartbeat || {
            echo "Scan failed — retrying in 5 minutes..."
            sleep 300
            ./target/release/cdc-az-daily-alert scan --heartbeat
          }

      - name: Commit updated state
        # State changes only when a signal fires; skip empty commits.
        # [skip ci] keeps ci.yml from running on state-only commits.
        run: |
          if ! git diff --quiet last_signals.json 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard last_signals.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_signals.json
            git commit -m "chore: update signal state [skip ci]"
            # Rebase in case something was pushed while the scan ran,
            # so the state push doesn't fail the whole run.
            git pull --rebase
            git push
          else
            echo "No state change — nothing to commit."
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="⚠️ Daily scan failed: $RUN_URL"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode text="$MSG" || true
          fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"$MSG\"}" || true
          fi
